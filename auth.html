<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OreBooking authentication page for secure sign in, sign up, and password reset." />
  <meta name="theme-color" content="#435abf" />
  <meta name="color-scheme" content="light dark" />
  <title>OreBooking - Sign In / Sign Up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    (function () {
      const savedTheme = localStorage.getItem("ore_theme") || "light";
      const savedLang = localStorage.getItem("ore_lang") || "en";

      document.documentElement.lang = savedLang;
      document.documentElement.dir = savedLang === "ar" ? "rtl" : "ltr";

      if (savedTheme === "dark") {
        document.documentElement.classList.add("preload-dark");
      }
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #435abf;
      --primary-hover: #34459c;
      --primary-light: #657be0;
      --accent: #7c3aed;
      --bg: #f8fbff;
      --bg-soft: #eef4ff;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-soft: #94a3b8;
      --input-bg: #f8fafc;
      --input-focus: #ffffff;
      --error: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --info: #0ea5e9;
      --error-bg: #fef2f2;
      --success-bg: #ecfdf5;
      --warning-bg: #fff7ed;
      --info-bg: #eff6ff;
      --error-border: #fecaca;
      --success-border: #a7f3d0;
      --warning-border: #fdba74;
      --info-border: #bfdbfe;
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow-card: 0 30px 70px rgba(15, 23, 42, 0.10);
      --shadow-soft: 0 20px 50px rgba(67, 90, 191, 0.12);
      --shadow-btn: 0 14px 30px rgba(67, 90, 191, 0.22);
      --ring: 0 0 0 4px rgba(67, 90, 191, 0.12);
      --transition: all .3s cubic-bezier(.16,1,.3,1);
      --font-en: "Outfit", sans-serif;
      --font-ar: "Tajawal", sans-serif;
    }

    .preload-dark body,
    body.dark {
      --primary: #6a82f0;
      --primary-hover: #5872e8;
      --primary-light: #8ea2ff;
      --accent: #8b5cf6;
      --bg: #081120;
      --bg-soft: #0f172a;
      --surface: rgba(15, 23, 42, 0.82);
      --surface-strong: #0f172a;
      --border: rgba(51, 65, 85, 0.95);
      --border-strong: rgba(71, 85, 105, 1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-soft: #64748b;
      --input-bg: rgba(15, 23, 42, 0.88);
      --input-focus: rgba(15, 23, 42, 1);
      --shadow-card: 0 30px 80px rgba(0, 0, 0, 0.42);
      --shadow-soft: 0 26px 60px rgba(67, 90, 191, 0.20);
      --shadow-btn: 0 16px 34px rgba(101, 123, 224, 0.28);
      --error-bg: rgba(239, 68, 68, 0.12);
      --success-bg: rgba(16, 185, 129, 0.12);
      --warning-bg: rgba(245, 158, 11, 0.12);
      --info-bg: rgba(14, 165, 233, 0.12);
      --error-border: rgba(239, 68, 68, 0.28);
      --success-border: rgba(16, 185, 129, 0.28);
      --warning-border: rgba(245, 158, 11, 0.28);
      --info-border: rgba(14, 165, 233, 0.28);
      --ring: 0 0 0 4px rgba(101, 123, 224, 0.14);
    }

    html[lang="ar"] body,
    html[dir="rtl"] body { font-family: var(--font-ar); }

    html[lang="en"] body,
    html[dir="ltr"] body { font-family: var(--font-en); }

    html, body { min-height: 100%; }

    body {
      min-height: 100dvh;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 12% 12%, rgba(101, 123, 224, 0.16), transparent 24%),
        radial-gradient(circle at 88% 18%, rgba(124, 58, 237, 0.11), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(67, 90, 191, 0.08), transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
      transition: background-color .3s ease, color .3s ease;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 999px;
      filter: blur(80px);
      opacity: .24;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: -80px;
      inset-inline-start: -80px;
      background: rgba(101, 123, 224, 0.38);
    }

    body::after {
      bottom: -120px;
      inset-inline-end: -80px;
      background: rgba(124, 58, 237, 0.28);
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    #auth-app {
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .auth-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
      border-radius: 32px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.45);
      box-shadow: var(--shadow-card);
      background: transparent;
    }

    .auth-brand-panel {
      position: relative;
      padding: 42px;
      background:
        linear-gradient(160deg, rgba(67, 90, 191, 0.94), rgba(101, 123, 224, 0.92) 52%, rgba(124, 58, 237, 0.88));
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 760px;
      overflow: hidden;
      isolation: isolate;
    }

    .auth-brand-panel::before,
    .auth-brand-panel::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      z-index: -1;
    }

    .auth-brand-panel::before {
      width: 320px;
      height: 320px;
      top: -80px;
      inset-inline-end: -70px;
    }

    .auth-brand-panel::after {
      width: 240px;
      height: 240px;
      bottom: -60px;
      inset-inline-start: -40px;
    }

    .brand-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: #fff;
    }

    .brand-logo-badge {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.24);
      box-shadow: 0 16px 32px rgba(0,0,0,.12);
      font-size: 1.55rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .brand-logo-copy strong {
      display: block;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .brand-logo-copy span {
      display: block;
      margin-top: 4px;
      font-size: .92rem;
      color: rgba(255,255,255,.84);
      line-height: 1.6;
      max-width: 360px;
    }

    .auth-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn,
    .lang-btn {
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.12);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
      font-weight: 700;
    }

    .icon-btn { width: 44px; font-size: 1.15rem; }
    .lang-btn { padding: 0 16px; }

    .icon-btn:hover,
    .lang-btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.20);
    }

    .brand-middle {
      display: grid;
      gap: 22px;
      align-content: center;
      margin: 28px 0 20px;
    }

    .brand-pill {
      width: max-content;
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.20);
      font-size: .86rem;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
    }

    .brand-title {
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -1px;
      max-width: 520px;
    }

    .brand-text {
      max-width: 520px;
      font-size: 1.02rem;
      line-height: 1.9;
      color: rgba(255,255,255,.88);
    }

    .brand-feature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 6px;
      max-width: 560px;
    }

    .brand-feature {
      padding: 16px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: grid;
      gap: 8px;
      min-height: 112px;
    }

    .brand-feature i {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.14);
      font-size: 1.2rem;
    }

    .brand-feature strong {
      font-size: .96rem;
      font-weight: 800;
    }

    .brand-feature p {
      font-size: .86rem;
      line-height: 1.7;
      color: rgba(255,255,255,.82);
    }

    .brand-bottom {
      display: grid;
      gap: 16px;
    }

    .brand-stat-row {
      display: flex;
      align-items: stretch;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-stat {
      flex: 1;
      min-width: 150px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: grid;
      gap: 6px;
    }

    .brand-stat strong {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .brand-stat span {
      font-size: .84rem;
      color: rgba(255,255,255,.80);
      line-height: 1.6;
    }

    .auth-panel {
      position: relative;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 32px;
      border-inline-start: 1px solid rgba(255,255,255,.3);
    }

    .auth-panel-inner {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .mobile-brand-link {
      display: none;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--text);
    }

    .mobile-brand-link .badge {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      box-shadow: var(--shadow-btn);
      font-size: 1.4rem;
    }

    .mobile-brand-link strong {
      display: block;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .mobile-brand-link span {
      display: block;
      margin-top: 4px;
      font-size: .84rem;
      color: var(--text-muted);
    }

    .form-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
      padding: 8px;
      border-radius: 18px;
      background: rgba(67, 90, 191, 0.05);
      border: 1px solid rgba(67, 90, 191, 0.08);
    }

    .form-tab {
      min-height: 46px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
    }

    .form-tab.active {
      background: var(--surface-strong);
      color: var(--primary);
      box-shadow: 0 10px 22px rgba(67, 90, 191, 0.10);
    }

    .auth-message {
      padding: 14px 16px;
      border-radius: 16px;
      font-size: .92rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.7;
      animation: fadeIn .25s ease;
    }

    .auth-message i {
      font-size: 1.18rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .auth-message.error {
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid var(--error-border);
    }

    .auth-message.success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success-border);
    }

    .auth-message.info {
      background: var(--info-bg);
      color: var(--info);
      border: 1px solid var(--info-border);
    }

    .auth-form {
      animation: fadeIn .35s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(67, 90, 191, 0.07);
      border: 1px solid rgba(67, 90, 191, 0.10);
      color: var(--primary);
      font-size: .8rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .auth-title {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -.4px;
    }

    .auth-subtitle {
      font-size: .96rem;
      color: var(--text-muted);
      margin-bottom: 26px;
      line-height: 1.8;
    }

    .input-grid {
      display: grid;
      gap: 18px;
    }

    .two-cols {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: .86rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .required-star {
      color: var(--error);
    }

    .input-icon-wrap {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      background: var(--input-bg);
      transition: var(--transition);
    }

    .input-icon-wrap:focus-within {
      border-color: var(--primary);
      background: var(--input-focus);
      box-shadow: var(--ring);
    }

    .input-icon-wrap.invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, .10);
    }

    .input-icon-wrap > i:first-child {
      position: absolute;
      top: 50%;
      inset-inline-start: 16px;
      transform: translateY(-50%);
      font-size: 1.14rem;
      color: var(--text-muted);
      pointer-events: none;
      transition: color var(--transition);
    }

    .input-icon-wrap:focus-within > i:first-child {
      color: var(--primary);
    }

    .input-group input {
      width: 100%;
      height: 56px;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 0 16px 0 46px;
      outline: none;
      font-size: .98rem;
      font-family: inherit;
    }

    html[dir="rtl"] .input-group input {
      padding: 0 46px 0 16px;
    }

    .password-field input {
      padding-inline-end: 52px;
    }

    .input-group input::placeholder {
      color: var(--text-soft);
      opacity: .9;
    }

    .pass-toggle {
      position: absolute;
      top: 0;
      bottom: 0;
      inset-inline-end: 0;
      width: 50px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      transition: var(--transition);
    }

    .pass-toggle:hover { color: var(--primary); }

    .helper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .field-hint {
      font-size: .79rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .password-strength {
      display: block;
      margin-top: 12px;
    }

    .strength-bars {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .str-bar {
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      transition: var(--transition);
    }

    .str-bar.filled.weak { background: #ef4444; }
    .str-bar.filled.fair { background: #f59e0b; }
    .str-bar.filled.good { background: #3b82f6; }
    .str-bar.filled.strong { background: #10b981; }

    .strength-label {
      font-size: .82rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .auth-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 8px 0 4px;
    }

    .checkbox-container {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      color: var(--text-muted);
      user-select: none;
      line-height: 1.7;
    }

    .checkbox-container:hover { color: var(--text); }
    .checkbox-container input[type="checkbox"] { display: none; }

    .checkmark {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      background: var(--input-bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .22s cubic-bezier(.34,1.56,.64,1);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .checkbox-container input:checked + .checkmark {
      background: var(--primary);
      border-color: var(--primary);
      transform: scale(1.05);
    }

    .checkbox-container input:checked + .checkmark::after {
      content: "";
      width: 5px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
      display: block;
    }

    .inline-link,
    .forgot-link {
      font-size: .9rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      transition: var(--transition);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .inline-link:hover,
    .forgot-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .primary-btn {
      position: relative;
      width: 100%;
      min-height: 56px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--shadow-btn);
      overflow: hidden;
    }

    .primary-btn::before {
      content: "";
      position: absolute;
      top: 0;
      inset-inline-start: -120%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      transform: skewX(-18deg);
      transition: .55s;
    }

    .primary-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(67, 90, 191, 0.30);
    }

    .primary-btn:hover:not(:disabled)::before {
      inset-inline-start: 150%;
    }

    .primary-btn:disabled {
      opacity: .72;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      color: var(--text-muted);
      font-size: .84rem;
      font-weight: 700;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .social-logins {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .social-btn {
      min-height: 52px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: var(--surface-strong);
      color: var(--text);
      font-size: .92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: var(--transition);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
    }

    .social-btn:hover:not(:disabled) {
      background: var(--input-bg);
      transform: translateY(-1px);
      border-color: rgba(67, 90, 191, 0.18);
      color: var(--primary);
    }

    .social-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .social-btn img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .switch-form-text {
      margin-top: 22px;
      text-align: center;
      font-size: .94rem;
      color: var(--text-muted);
      line-height: 1.8;
      font-weight: 600;
    }

    .switch-form-text a,
    .switch-form-text button {
      color: var(--primary);
      font-weight: 800;
      margin-inline-start: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .legal-note {
      margin-top: 18px;
      text-align: center;
      color: var(--text-soft);
      font-size: .79rem;
      line-height: 1.8;
    }

    .legal-note a {
      color: var(--primary);
      font-weight: 700;
    }

    .hidden { display: none !important; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .ph-spin { animation: spin .8s linear infinite; display: inline-block; }

    @media (max-width: 980px) {
      .auth-shell {
        grid-template-columns: 1fr;
        max-width: 680px;
      }

      .auth-brand-panel {
        min-height: auto;
        padding: 28px;
      }

      .brand-middle {
        margin-top: 18px;
      }

      .auth-panel {
        border-inline-start: none;
        border-top: 1px solid rgba(255,255,255,.24);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .auth-shell {
        border-radius: 24px;
      }

      .auth-brand-panel {
        display: none;
      }

      .auth-panel {
        padding: 20px;
      }

      .auth-panel-inner {
        max-width: 100%;
      }

      .mobile-brand-link {
        display: flex;
      }

      .form-tabs {
        grid-template-columns: 1fr;
      }

      .two-cols,
      .social-logins {
        grid-template-columns: 1fr;
      }

      .auth-title {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
