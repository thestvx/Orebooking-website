<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OreBooking authentication page for secure sign in, sign up, and password reset." />
  <meta name="theme-color" content="#435abf" />
  <meta name="color-scheme" content="light dark" />
  <title>OreBooking - Sign In / Sign Up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <script>
    (function () {
      const savedTheme = localStorage.getItem("ore_theme") || "light";
      const savedLang = localStorage.getItem("ore_lang") || "en";
      document.documentElement.lang = savedLang;
      document.documentElement.dir = savedLang === "ar" ? "rtl" : "ltr";
      if (savedTheme === "dark") document.documentElement.classList.add("preload-dark");
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #435abf;
      --primary-hover: #34459c;
      --primary-light: #657be0;
      --accent: #7c3aed;
      --bg: #f8fbff;
      --bg-soft: #eef4ff;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-soft: #94a3b8;
      --input-bg: #f8fafc;
      --input-focus: #ffffff;
      --error: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --info: #0ea5e9;
      --error-bg: #fef2f2;
      --success-bg: #ecfdf5;
      --warning-bg: #fff7ed;
      --info-bg: #eff6ff;
      --error-border: #fecaca;
      --success-border: #a7f3d0;
      --warning-border: #fdba74;
      --info-border: #bfdbfe;
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow-card: 0 30px 70px rgba(15, 23, 42, 0.10);
      --shadow-soft: 0 20px 50px rgba(67, 90, 191, 0.12);
      --shadow-btn: 0 14px 30px rgba(67, 90, 191, 0.22);
      --ring: 0 0 0 4px rgba(67, 90, 191, 0.12);
      --transition: all .3s cubic-bezier(.16,1,.3,1);
      --font-en: "Outfit", sans-serif;
      --font-ar: "Tajawal", sans-serif;
    }

    .preload-dark body,
    body.dark {
      --primary: #6a82f0;
      --primary-hover: #5872e8;
      --primary-light: #8ea2ff;
      --accent: #8b5cf6;
      --bg: #081120;
      --bg-soft: #0f172a;
      --surface: rgba(15, 23, 42, 0.82);
      --surface-strong: #0f172a;
      --border: rgba(51, 65, 85, 0.95);
      --border-strong: rgba(71, 85, 105, 1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-soft: #64748b;
      --input-bg: rgba(15, 23, 42, 0.88);
      --input-focus: rgba(15, 23, 42, 1);
      --shadow-card: 0 30px 80px rgba(0, 0, 0, 0.42);
      --shadow-soft: 0 26px 60px rgba(67, 90, 191, 0.20);
      --shadow-btn: 0 16px 34px rgba(101, 123, 224, 0.28);
      --error-bg: rgba(239, 68, 68, 0.12);
      --success-bg: rgba(16, 185, 129, 0.12);
      --warning-bg: rgba(245, 158, 11, 0.12);
      --info-bg: rgba(14, 165, 233, 0.12);
      --error-border: rgba(239, 68, 68, 0.28);
      --success-border: rgba(16, 185, 129, 0.28);
      --warning-border: rgba(245, 158, 11, 0.28);
      --info-border: rgba(14, 165, 233, 0.28);
      --ring: 0 0 0 4px rgba(101, 123, 224, 0.14);
    }

    html[lang="ar"] body,
    html[dir="rtl"] body { font-family: var(--font-ar); }

    html[lang="en"] body,
    html[dir="ltr"] body { font-family: var(--font-en); }

    html, body { min-height: 100%; }

    body {
      min-height: 100dvh;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 12% 12%, rgba(101, 123, 224, 0.16), transparent 24%),
        radial-gradient(circle at 88% 18%, rgba(124, 58, 237, 0.11), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(67, 90, 191, 0.08), transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
      transition: background-color .3s ease, color .3s ease;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 999px;
      filter: blur(80px);
      opacity: .24;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: -80px;
      inset-inline-start: -80px;
      background: rgba(101, 123, 224, 0.38);
    }

    body::after {
      bottom: -120px;
      inset-inline-end: -80px;
      background: rgba(124, 58, 237, 0.28);
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    #auth-app {
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .auth-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
      border-radius: 32px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.45);
      box-shadow: var(--shadow-card);
      background: transparent;
    }

    .auth-brand-panel {
      position: relative;
      padding: 42px;
      background:
        linear-gradient(160deg, rgba(67, 90, 191, 0.94), rgba(101, 123, 224, 0.92) 52%, rgba(124, 58, 237, 0.88));
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 760px;
      overflow: hidden;
      isolation: isolate;
    }

    .auth-brand-panel::before,
    .auth-brand-panel::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      z-index: -1;
    }

    .auth-brand-panel::before {
      width: 320px;
      height: 320px;
      top: -80px;
      inset-inline-end: -70px;
    }

    .auth-brand-panel::after {
      width: 240px;
      height: 240px;
      bottom: -60px;
      inset-inline-start: -40px;
    }

    .brand-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand-logo-link {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: #fff;
    }

    .brand-logo-badge {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.24);
      box-shadow: 0 16px 32px rgba(0,0,0,.12);
      font-size: 1.55rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .brand-logo-copy strong {
      display: block;
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .brand-logo-copy span {
      display: block;
      margin-top: 4px;
      font-size: .92rem;
      color: rgba(255,255,255,.84);
      line-height: 1.6;
      max-width: 360px;
    }

    .auth-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn,
    .lang-btn {
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.12);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 22px rgba(0,0,0,.08);
      font-weight: 700;
    }

    .icon-btn { width: 44px; font-size: 1.15rem; }
    .lang-btn { padding: 0 16px; }

    .icon-btn:hover,
    .lang-btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.20);
    }

    .brand-middle {
      display: grid;
      gap: 22px;
      align-content: center;
      margin: 28px 0 20px;
    }

    .brand-pill {
      width: max-content;
      max-width: 100%;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.20);
      font-size: .86rem;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
    }

    .brand-title {
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -1px;
      max-width: 520px;
    }

    .brand-text {
      max-width: 520px;
      font-size: 1.02rem;
      line-height: 1.9;
      color: rgba(255,255,255,.88);
    }

    .brand-feature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 6px;
      max-width: 560px;
    }

    .brand-feature {
      padding: 16px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: grid;
      gap: 8px;
      min-height: 112px;
    }

    .brand-feature i {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.14);
      font-size: 1.2rem;
    }

    .brand-feature strong {
      font-size: .96rem;
      font-weight: 800;
    }

    .brand-feature p {
      font-size: .86rem;
      line-height: 1.7;
      color: rgba(255,255,255,.82);
    }

    .brand-bottom {
      display: grid;
      gap: 16px;
    }

    .brand-stat-row {
      display: flex;
      align-items: stretch;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand-stat {
      flex: 1;
      min-width: 150px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: grid;
      gap: 6px;
    }

    .brand-stat strong {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .brand-stat span {
      font-size: .84rem;
      color: rgba(255,255,255,.80);
      line-height: 1.6;
    }

    .auth-panel {
      position: relative;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 32px;
      border-inline-start: 1px solid rgba(255,255,255,.3);
    }

    .auth-panel-inner {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .mobile-brand-link {
      display: none;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--text);
    }

    .mobile-brand-link .badge {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      box-shadow: var(--shadow-btn);
      font-size: 1.4rem;
    }

    .mobile-brand-link strong {
      display: block;
      font-size: 1.25rem;
      font-weight: 800;
    }

    .mobile-brand-link span {
      display: block;
      margin-top: 4px;
      font-size: .84rem;
      color: var(--text-muted);
    }

    .form-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
      padding: 8px;
      border-radius: 18px;
      background: rgba(67, 90, 191, 0.05);
      border: 1px solid rgba(67, 90, 191, 0.08);
    }

    .form-tab {
      min-height: 46px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
    }

    .form-tab.active {
      background: var(--surface-strong);
      color: var(--primary);
      box-shadow: 0 10px 22px rgba(67, 90, 191, 0.10);
    }

    .auth-message {
      padding: 14px 16px;
      border-radius: 16px;
      font-size: .92rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.7;
      animation: fadeIn .25s ease;
    }

    .auth-message i {
      font-size: 1.18rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .auth-message.error {
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid var(--error-border);
    }

    .auth-message.success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success-border);
    }

    .auth-message.info {
      background: var(--info-bg);
      color: var(--info);
      border: 1px solid var(--info-border);
    }

    .auth-form {
      animation: fadeIn .35s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(67, 90, 191, 0.07);
      border: 1px solid rgba(67, 90, 191, 0.10);
      color: var(--primary);
      font-size: .8rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .auth-title {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -.4px;
    }

    .auth-subtitle {
      font-size: .96rem;
      color: var(--text-muted);
      margin-bottom: 26px;
      line-height: 1.8;
    }

    .input-grid {
      display: grid;
      gap: 18px;
    }

    .two-cols {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: .86rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .required-star {
      color: var(--error);
    }

    .input-icon-wrap {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      background: var(--input-bg);
      transition: var(--transition);
    }

    .input-icon-wrap:focus-within {
      border-color: var(--primary);
      background: var(--input-focus);
      box-shadow: var(--ring);
    }

    .input-icon-wrap.invalid {
      border-color: var(--error);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, .10);
    }

    .input-icon-wrap > i:first-child {
      position: absolute;
      top: 50%;
      inset-inline-start: 16px;
      transform: translateY(-50%);
      font-size: 1.14rem;
      color: var(--text-muted);
      pointer-events: none;
      transition: color var(--transition);
    }

    .input-icon-wrap:focus-within > i:first-child {
      color: var(--primary);
    }

    .input-group input {
      width: 100%;
      height: 56px;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 0 16px 0 46px;
      outline: none;
      font-size: .98rem;
      font-family: inherit;
    }

    html[dir="rtl"] .input-group input {
      padding: 0 46px 0 16px;
    }

    .password-field input {
      padding-inline-end: 52px;
    }

    .input-group input::placeholder {
      color: var(--text-soft);
      opacity: .9;
    }

    .pass-toggle {
      position: absolute;
      top: 0;
      bottom: 0;
      inset-inline-end: 0;
      width: 50px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-size: 1.15rem;
      transition: var(--transition);
    }

    .pass-toggle:hover { color: var(--primary); }

    .helper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .field-hint {
      font-size: .79rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .password-strength {
      display: block;
      margin-top: 12px;
    }

    .strength-bars {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .str-bar {
      height: 6px;
      border-radius: 999px;
      background: var(--border);
      transition: var(--transition);
    }

    .str-bar.filled.weak { background: #ef4444; }
    .str-bar.filled.fair { background: #f59e0b; }
    .str-bar.filled.good { background: #3b82f6; }
    .str-bar.filled.strong { background: #10b981; }

    .strength-label {
      font-size: .82rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .auth-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 8px 0 4px;
    }

    .checkbox-container {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      color: var(--text-muted);
      user-select: none;
      line-height: 1.7;
    }

    .checkbox-container:hover { color: var(--text); }
    .checkbox-container input[type="checkbox"] { display: none; }

    .checkmark {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      background: var(--input-bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .22s cubic-bezier(.34,1.56,.64,1);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .checkbox-container input:checked + .checkmark {
      background: var(--primary);
      border-color: var(--primary);
      transform: scale(1.05);
    }

    .checkbox-container input:checked + .checkmark::after {
      content: "";
      width: 5px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
      display: block;
    }

    .inline-link,
    .forgot-link {
      font-size: .9rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      transition: var(--transition);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .inline-link:hover,
    .forgot-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .primary-btn {
      position: relative;
      width: 100%;
      min-height: 56px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--shadow-btn);
      overflow: hidden;
    }

    .primary-btn::before {
      content: "";
      position: absolute;
      top: 0;
      inset-inline-start: -120%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      transform: skewX(-18deg);
      transition: .55s;
    }

    .primary-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(67, 90, 191, 0.30);
    }

    .primary-btn:hover:not(:disabled)::before {
      inset-inline-start: 150%;
    }

    .primary-btn:disabled {
      opacity: .72;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 22px 0;
      color: var(--text-muted);
      font-size: .84rem;
      font-weight: 700;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .social-logins {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .social-btn {
      min-height: 52px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: var(--surface-strong);
      color: var(--text);
      font-size: .92rem;

    @media (max-width: 980px) {
      .auth-shell {
        grid-template-columns: 1fr;

    const STORAGE = {
      theme: "ore_theme",
      lang: "ore_lang",
      activeTab: "ore_auth_tab",
      remember: "ore_auth_remember",
      profilePrefix: "ore_profile_"
    };

    function getSavedTheme() {
      return localStorage.getItem(STORAGE.theme) || "light";
    }

    function getSavedLang() {
      return localStorage.getItem(STORAGE.lang) || "en";
    }

    function applyTheme(theme) {
      document.body.classList.toggle("dark", theme === "dark");
      localStorage.setItem(STORAGE.theme, theme);
    }

    function applyLang(lang, t) {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      localStorage.setItem(STORAGE.lang, lang);
      document.title = t.page_title;
    }

    function safeFirebaseInit() {
      try {
        if (!window.firebase) return false;
        if (firebase.apps && firebase.apps.length) return true;
        if (window.firebaseConfig) {
          firebase.initializeApp(window.firebaseConfig);
          return true;
        }
        return false;
      } catch (err) {
        return false;
      }
    }

    function hasAuthReady() {
      try {
        return !!(window.firebase && firebase.auth && firebase.apps && firebase.apps.length);
      } catch (err) {
        return false;
      }
    }

    function getAuthInstance() {
      try {
        return hasAuthReady() ? firebase.auth() : null;
      } catch (err) {
        return null;
      }
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || "").trim());
    }

    function isStrongEnoughPassword(value) {
      const password = String(value || "");
      return password.length >= 8 && /[A-Za-z]/.test(password) && /\d/.test(password);
    }

    function passwordScore(value) {
      const password = String(value || "");
      let score = 0;
      if (password.length >= 8) score++;
      if (/[A-Za-z]/.test(password) && /\d/.test(password)) score++;
      if (/[A-Z]/.test(password) && /[a-z]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password) || password.length >= 12) score++;
      return Math.max(0, Math.min(4, score));
    }

    function humanFirebaseError(code, t) {
      const map = {
        "auth/invalid-email": t.invalid_email,
        "auth/missing-email": t.invalid_email,
        "auth/user-not-found": t.invalid_email,
        "auth/wrong-password": t.generic_error,
        "auth/invalid-credential": t.generic_error,
        "auth/email-already-in-use": "This email is already in use.",
        "auth/weak-password": t.invalid_password,
        "auth/too-many-requests": "Too many attempts. Please try again later.",
        "auth/popup-closed-by-user": "Popup was closed before completing sign-in.",
        "auth/network-request-failed": "Network error. Check your connection and try again."
      };

      const arMap = {
        "This email is already in use.": "هذا البريد مستخدم بالفعل.",
        "Too many attempts. Please try again later.": "عدد المحاولات كبير جدًا. حاول لاحقًا.",
        "Popup was closed before completing sign-in.": "تم إغلاق النافذة قبل إكمال تسجيل الدخول.",
        "Network error. Check your connection and try again.": "خطأ في الشبكة. تحقق من الاتصال وحاول مرة أخرى."
      };

      const message = map[code] || t.generic_error;
      return getSavedLang() === "ar" && arMap[message] ? arMap[message] : message;
    }

    function getRedirectUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("redirect") || "index.html";
    }

    function saveProfile(email, data) {
      if (!email) return;
      try {
        localStorage.setItem(STORAGE.profilePrefix + email.toLowerCase(), JSON.stringify(data || {}));
      } catch (err) {}
    }

    function getGoogleIcon() {
      return "https://www.svgrepo.com/show/475656/google-color.svg";
    }

    function App() {
      const [lang, setLang] = React.useState(getSavedLang());
      const [theme, setTheme] = React.useState(getSavedTheme());
      const [tab, setTab] = React.useState(localStorage.getItem(STORAGE.activeTab) || "login");
      const [message, setMessage] = React.useState(null);
      const [loading, setLoading] = React.useState({
        login: false,
        register: false,
        forgot: false,
        google: false
      });

      const [showPass, setShowPass] = React.useState({
        login: false,
        reg: false,
        confirm: false
      });

      const [loginForm, setLoginForm] = React.useState({
        email: "",
        password: "",
        remember: localStorage.getItem(STORAGE.remember) !== "0"
      });

      const [registerForm, setRegisterForm] = React.useState({
        name: "",
        email: "",
        phone: "",
        password: "",
        confirmPassword: "",
        agreeTerms: false
      });

      const [forgotForm, setForgotForm] = React.useState({
        email: ""
      });

      const t = authI18n[lang] || authI18n.en;
      const strength = passwordScore(registerForm.password);

      React.useEffect(() => {
        safeFirebaseInit();
      }, []);

      React.useEffect(() => {
        applyTheme(theme);
      }, [theme]);

      React.useEffect(() => {
        applyLang(lang, t);
      }, [lang]);

      React.useEffect(() => {
        localStorage.setItem(STORAGE.activeTab, tab);
      }, [tab]);

      React.useEffect(() => {
        localStorage.setItem(STORAGE.remember, loginForm.remember ? "1" : "0");
      }, [loginForm.remember]);

      function openTab(nextTab) {
        setTab(nextTab);
        setMessage(null);
      }

      function flash(type, text) {
        setMessage({ type, text });
      }

      function toggleTheme() {
        setTheme(prev => prev === "dark" ? "light" : "dark");
      }

      function toggleLang() {
        setLang(prev => prev === "ar" ? "en" : "ar");
      }

      function updateLogin(field, value) {
        setLoginForm(prev => ({ ...prev, [field]: value }));
      }

      function updateRegister(field, value) {
        setRegisterForm(prev => ({ ...prev, [field]: value }));
      }

      function updateForgot(field, value) {
        setForgotForm(prev => ({ ...prev, [field]: value }));
      }

      function togglePassword(fieldKey) {
        setShowPass(prev => ({ ...prev, [fieldKey]: !prev[fieldKey] }));
      }

      async function handleLogin(event) {
        event.preventDefault();
        setMessage(null);

        if (!isValidEmail(loginForm.email)) {
          return flash("error", t.invalid_email);
        }

        if (!loginForm.password) {
          return flash("error", t.invalid_password);
        }

        if (!safeFirebaseInit() || !hasAuthReady()) {
          return flash("error", t.firebase_missing);
        }

        setLoading(prev => ({ ...prev, login: true }));

        try {
          const auth = getAuthInstance();
          const persistence = loginForm.remember
            ? firebase.auth.Auth.Persistence.LOCAL
            : firebase.auth.Auth.Persistence.SESSION;

          await auth.setPersistence(persistence);
          await auth.signInWithEmailAndPassword(loginForm.email.trim(), loginForm.password);
          flash("success", t.login_success);

          setTimeout(() => {
            window.location.href = getRedirectUrl();
          }, 900);
        } catch (err) {
          flash("error", humanFirebaseError(err.code, t));
        } finally {
          setLoading(prev => ({ ...prev, login: false }));
        }
      }

      async function handleRegister(event) {
        event.preventDefault();
        setMessage(null);

        if (!registerForm.name.trim()) {
          return flash("error", t.invalid_name);
        }

        if (!isValidEmail(registerForm.email)) {
          return flash("error", t.invalid_email);
        }

        if (!isStrongEnoughPassword(registerForm.password)) {
          return flash("error", t.invalid_password);
        }

        if (registerForm.password !== registerForm.confirmPassword) {
          return flash("error", t.password_mismatch);
        }

        if (!registerForm.agreeTerms) {
          return flash("error", t.terms_required);
        }

        if (!safeFirebaseInit() || !hasAuthReady()) {
          return flash("error", t.firebase_missing);
        }

        setLoading(prev => ({ ...prev, register: true }));

        try {
          const auth = getAuthInstance();
          const cred = await auth.createUserWithEmailAndPassword(registerForm.email.trim(), registerForm.password);

          if (cred.user && registerForm.name.trim()) {
            await cred.user.updateProfile({ displayName: registerForm.name.trim() });
          }

          saveProfile(registerForm.email, {
            name: registerForm.name.trim(),
            phone: registerForm.phone.trim(),
            email: registerForm.email.trim()
          });

          flash("success", t.register_success);
          setLoginForm(prev => ({
            ...prev,
            email: registerForm.email.trim(),
            password: ""
          }));

          setRegisterForm({
            name: "",
            email: "",
            phone: "",
            password: "",
            confirmPassword: "",
            agreeTerms: false
          });

          setTimeout(() => {
            openTab("login");
          }, 700);
        } catch (err) {
          flash("error", humanFirebaseError(err.code, t));
        } finally {
          setLoading(prev => ({ ...prev, register: false }));
        }
      }

      async function handleForgot(event) {
        event.preventDefault();
        setMessage(null);

        if (!isValidEmail(forgotForm.email)) {
          return flash("error", t.invalid_email);
        }

        if (!safeFirebaseInit() || !hasAuthReady()) {
          return flash("error", t.firebase_missing);
        }

        setLoading(prev => ({ ...prev, forgot: true }));

        try {
          const auth = getAuthInstance();
          await auth.sendPasswordResetEmail(forgotForm.email.trim());
          flash("success", t.reset_success);
        } catch (err) {
          flash("error", humanFirebaseError(err.code, t));
        } finally {
          setLoading(prev => ({ ...prev, forgot: false }));
        }
      }

      async function handleGoogle() {
        setMessage(null);

        if (!safeFirebaseInit() || !hasAuthReady()) {
          return flash("error", t.firebase_missing);
        }

        setLoading(prev => ({ ...prev, google: true }));

        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          const auth = getAuthInstance();
          const result = await auth.signInWithPopup(provider);

          const user = result.user;
          if (user) {
            saveProfile(user.email, {
              name: user.displayName || "",
              email: user.email || "",
              phone: user.phoneNumber || ""
            });
          }

          flash("success", t.social_success);
          setTimeout(() => {
            window.location.href = getRedirectUrl();
          }, 800);
        } catch (err) {
          flash("error", humanFirebaseError(err.code, t));
        } finally {
          setLoading(prev => ({ ...prev, google: false }));
        }
      }

      function handleApple() {
        flash("info", t.apple_unavailable);
      }

      function renderStrengthLabel() {
        if (!registerForm.password) return "";
        if (strength <= 1) return t.weak;
        if (strength === 2) return t.fair;
        if (strength === 3) return t.good;
        return t.strong;
      }

      function strengthClass(index) {
        if (index >= strength) return "";
        if (strength <= 1) return "filled weak";
        if (strength === 2) return "filled fair";
        if (strength === 3) return "filled good";
        return "filled strong";
      }

      return (
        <main className="auth-shell" aria-label="OreBooking Authentication">
          <section className="auth-brand-panel" aria-hidden="false">
            <div className="brand-top">
              <a href="index.html" className="brand-logo-link" aria-label={t.back_home}>
                <div className="brand-logo-badge">
                  <i className="ph-fill ph-buildings"></i>
                </div>
                <div className="brand-logo-copy">
                  <strong>OreBooking</strong>
                  <span>{t.brand_microcopy}</span>
                </div>
              </a>

              <div className="auth-controls">
                <button
                  id="theme-toggle"
                  className="icon-btn"
                  type="button"
                  aria-label="Toggle Theme"
                  onClick={toggleTheme}
                >
                  <i className={theme === "dark" ? "ph ph-sun" : "ph ph-moon"}></i>
                </button>

                <button
                  id="lang-toggle"
                  className="lang-btn"
                  type="button"
                  onClick={toggleLang}
                >
                  {t.lang_btn}
                </button>
              </div>
            </div>

            <div className="brand-middle">
              <div className="brand-pill">
                <i className="ph-fill ph-shield-check"></i>
                <span>{t.brand_pill}</span>
              </div>

              <h1 className="brand-title">{t.brand_title}</h1>
              <p className="brand-text">{t.brand_text}</p>

              <div className="brand-feature-grid">
                <div className="brand-feature">
                  <i className="ph ph-calendar-check"></i>
                  <strong>{t.feature_1_title}</strong>
                  <p>{t.feature_1_text}</p>
                </div>

                <div className="brand-feature">
                  <i className="ph ph-gift"></i>
                  <strong>{t.feature_2_title}</strong>
                  <p>{t.feature_2_text}</p>
                </div>

                <div className="brand-feature">
                  <i className="ph ph-heart-straight"></i>
                  <strong>{t.feature_3_title}</strong>
                  <p>{t.feature_3_text}</p>
                </div>

                <div className="brand-feature">
                  <i className="ph ph-lock-key"></i>
                  <strong>{t.feature_4_title}</strong>
                  <p>{t.feature_4_text}</p>
                </div>
              </div>
            </div>

            <div className="brand-bottom">
              <div className="brand-stat-row">
                <div className="brand-stat">
                  <strong>24/7</strong>
                  <span>{t.stat_1}</span>
                </div>
                <div className="brand-stat">
                  <strong>{lang === "ar" ? "حساب واحد" : "1 Account"}</strong>
                  <span>{t.stat_2}</span>
                </div>
              </div>
            </div>
          </section>

          <section className="auth-panel">
            <div className="auth-panel-inner">
              <a href="index.html" className="mobile-brand-link" aria-label={t.back_home}>
                <div className="badge"><i className="ph-fill ph-buildings"></i></div>
                <div>
                  <strong>OreBooking</strong>
                  <span>{t.mobile_brand_text}</span>
                </div>
              </a>

              <div className="form-tabs" role="tablist" aria-label="Authentication forms">
                <button
                  type="button"
                  className={`form-tab ${tab === "login" ? "active" : ""}`}
                  role="tab"
                  aria-selected={tab === "login"}
                  onClick={() => openTab("login")}
                >
                  {t.sign_in}
                </button>

                <button
                  type="button"
                  className={`form-tab ${tab === "register" ? "active" : ""}`}
                  role="tab"
                  aria-selected={tab === "register"}
                  onClick={() => openTab("register")}
                >
                  {t.sign_up_btn}
                </button>

                <button
                  type="button"
                  className={`form-tab ${tab === "forgot" ? "active" : ""}`}
                  role="tab"
                  aria-selected={tab === "forgot"}
                  onClick={() => openTab("forgot")}
                >
                  {t.reset_short}
                </button>
              </div>

              {message && (
                <div className={`auth-message ${message.type}`} role="alert" aria-live="polite">
                  <i className={
                    message.type === "success"
                      ? "ph ph-check-circle"
                      : message.type === "info"
                      ? "ph ph-info"
                      : "ph ph-warning-circle"
                  }></i>
                  <span>{message.text}</span>
                </div>
              )}

              {tab === "login" && (
                <form className="auth-form" onSubmit={handleLogin} noValidate>
                  <div className="auth-kicker">
                    <i className="ph ph-sign-in"></i>
                    <span>{t.welcome_back_small}</span>
                  </div>

                  <h2 className="auth-title">{t.welcome_back}</h2>
                  <p className="auth-subtitle">{t.login_desc}</p>

                  <div className="input-grid">
                    <div className="input-group">
                      <label htmlFor="login-email">
                        <span>{t.email}</span>
                        <span className="required-star">*</span>
                      </label>
                      <div className="input-icon-wrap">
                        <i className="ph ph-envelope"></i>
                        <input
                          type="email"
                          id="login-email"
                          placeholder="name@example.com"
                          required
                          autoComplete="email"
                          value={loginForm.email}
                          onChange={(e) => updateLogin("email", e.target.value)}
                        />
                      </div>
                    </div>

                    <div className="input-group">
                      <label htmlFor="login-password">
                        <span>{t.password}</span>
                        <span className="required-star">*</span>
                      </label>
                      <div className="input-icon-wrap password-field">
                        <i className="ph ph-lock"></i>
                        <input
                          type={showPass.login ? "text" : "password"}
                          id="login-password"
                          placeholder="••••••••"
                          required
                          autoComplete="current-password"
                          value={loginForm.password}
                          onChange={(e) => updateLogin("password", e.target.value)}
                        />
                        <button
                          type="button"
                          className="pass-toggle"
                          aria-label="Toggle password visibility"
                          onClick={() => togglePassword("login")}
                        >
                          <i className={showPass.login ? "ph ph-eye-slash" : "ph ph-eye"}></i>
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="auth-options">
                    <label className="checkbox-container">
                      <input
                        type="checkbox"
                        checked={loginForm.remember}
                        onChange={(e) => updateLogin("remember", e.target.checked)}
                      />
                      <span className="checkmark"></span>
                      <span>{t.remember_me}</span>
                    </label>

                    <button type="button" className="forgot-link" onClick={() => openTab("forgot")}>
                      {t.forgot_pass}
                    </button>
                  </div>

                  <button type="submit" className="primary-btn" disabled={loading.login}>
                    <i className={loading.login ? "ph ph-spinner-gap ph-spin" : "ph ph-sign-in"}></i>
                    <span>{loading.login ? t.loading_login : t.sign_in}</span>
                  </button>

                  <div className="auth-divider">
                    <span>{t.or_continue}</span>
                  </div>

                  <div className="social-logins">
                    <button type="button" className="social-btn" onClick={handleGoogle} disabled={loading.google}>
                      <img src={getGoogleIcon()} width="20" height="20" alt="Google" />
                      <span>{loading.google ? t.loading_google : t.google}</span>
                    </button>

                    <button type="button" className="social-btn" onClick={handleApple}>
                      <i className="ph-fill ph-apple-logo"></i>
                      <span>{t.apple}</span>
                    </button>
                  </div>

                  <p className="switch-form-text">
                    <span>{t.no_account}</span>
                    <button type="button" onClick={() => openTab("register")}>{t.sign_up}</button>
                  </p>

                  <p className="legal-note">{t.legal_note_login}</p>
                </form>
              )}

              {tab === "register" && (
                <form className="auth-form" onSubmit={handleRegister} noValidate>
                  <div className="auth-kicker">
                    <i className="ph ph-user-plus"></i>
                    <span>{t.create_account_small}</span>
                  </div>

                  <h2 className="auth-title">{t.create_account}</h2>
                  <p className="auth-subtitle">{t.register_desc}</p>

                  <div className="input-grid">
                    <div className="input-group">
                      <label htmlFor="reg-name">
                        <span>{t.full_name}</span>
                        <span className="required-star">*</span>
                      </label>
                      <div className="input-icon-wrap">
                        <i className="ph ph-user"></i>
                        <input
                          type="text"
                          id="reg-name"
                          placeholder={lang === "ar" ? "الاسم الكامل" : "John Doe"}
                          required
                          autoComplete="name"
                          value={registerForm.name}
                          onChange={(e) => updateRegister("name", e.target.value)}
                        />
                      </div>
                    </div>

                    <div className="two-cols">
                      <div className="input-group">
                        <label htmlFor="reg-email">
                          <span>{t.email}</span>
                          <span className="required-star">*</span>
                        </label>
                        <div className="input-icon-wrap">
                          <i className="ph ph-envelope"></i>
                          <input
                            type="email"
                            id="reg-email"
                            placeholder="name@example.com"
                            required
                            autoComplete="email"
                            value={registerForm.email}
                            onChange={(e) => updateRegister("email", e.target.value)}
                          />
                        </div>
                      </div>

                      <div className="input-group">
                        <label htmlFor="reg-phone">
                          <span>{t.phone_optional}</span>
                        </label>
                        <div className="input-icon-wrap">
                          <i className="ph ph-phone"></i>
                          <input
                            type="tel"
                            id="reg-phone"
                            placeholder="+213..."
                            autoComplete="tel"
                            value={registerForm.phone}
                            onChange={(e) => updateRegister("phone", e.target.value)}
                          />
                        </div>
                      </div>
                    </div>

                    <div className="input-group">
                      <label htmlFor="reg-password">
                        <span>{t.password}</span>
                        <span className="required-star">*</span>
                      </label>
                      <div className="input-icon-wrap password-field">
                        <i className="ph ph-lock"></i>
                        <input
                          type={showPass.reg ? "text" : "password"}
                          id="reg-password"
                          placeholder="••••••••"
                          required
                          autoComplete="new-password"
                          value={registerForm.password}
                          onChange={(e) => updateRegister("password", e.target.value)}
                        />
                        <button
                          type="button"
                          className="pass-toggle"
                          aria-label="Toggle password visibility"
                          onClick={() => togglePassword("reg")}
                        >
                          <i className={showPass.reg ? "ph ph-eye-slash" : "ph ph-eye"}></i>
                        </button>
                      </div>

                      <div className="helper-row">
                        <span className="field-hint">{t.password_hint}</span>
                      </div>

                      <div className="password-strength">
                        <div className="strength-bars">
                          <div className={`str-bar ${strengthClass(0)}`}></div>
                          <div className={`str-bar ${strengthClass(1)}`}></div>
                          <div className={`str-bar ${strengthClass(2)}`}></div>
                          <div className={`str-bar ${strengthClass(3)}`}></div>
                        </div>
                        <div className="strength-label">{renderStrengthLabel()}</div>
                      </div>
                    </div>

                    <div className="input-group">
                      <label htmlFor="reg-confirm-password">
                        <span>{t.confirm_password}</span>
                        <span className="required-star">*</span>
                      </label>
                      <div className="input-icon-wrap password-field">
                        <i className="ph ph-password"></i>
                        <input
                          type={showPass.confirm ? "text" : "password"}
                          id="reg-confirm-password"
                          placeholder="••••••••"
                          required
                          autoComplete="new-password"
                          value={registerForm.confirmPassword}
                          onChange={(e) => updateRegister("confirmPassword", e.target.value)}
                        />
                        <button
                          type="button"
                          className="pass-toggle"
                          aria-label="Toggle password visibility"
                          onClick={() => togglePassword("confirm")}
                        >
                          <i className={showPass.confirm ? "ph ph-eye-slash" : "ph ph-eye"}></i>
                        </button>
                      </div>
                    </div>

                    <div className="input-group">
                      <label className="checkbox-container" style={{ alignItems: "flex-start" }}>
                        <input
                          type="checkbox"
                          checked={registerForm.agreeTerms}
                          onChange={(e) => updateRegister("agreeTerms", e.target.checked)}
                        />
                        <span className="checkmark"></span>
                        <span>{t.agree_terms}</span>
                      </label>
                    </div>
                  </div>

                  <button type="submit" className="primary-btn" style={{ marginTop: "6px" }} disabled={loading.register}>
                    <i className={loading.register ? "ph ph-spinner-gap ph-spin" : "ph ph-user-plus"}></i>
                    <span>{loading.register ? t.loading_register : t.sign_up_btn}</span>
                  </button>

                  <p className="switch-form-text">
                    <span>{t.has_account}</span>
                    <button type="button" onClick={() => openTab("login")}>{t.sign_in}</button>
                  </p>

                  <p className="legal-note">{t.legal_note_register}</p>
                </form>
              )}

              {tab === "forgot" && (
                <form className="auth-form" onSubmit={handleForgot} noValidate>
                  <div className="auth-kicker">
                    <i className="ph ph-key"></i>
                    <span>{t.reset_small}</span>
                  </div>

                  <h2 className="auth-title">{t.reset_title}</h2>
                  <p className="auth-subtitle">{t.reset_desc}</p>

                  <div className="input-grid">
                    <div className="input-group">
                      <label htmlFor="forgot-email">
                        <span>{t.email}</span>
                        <span className="required-star">*</span>
                      </label>
                      <div className="input-icon-wrap">
                        <i className="ph ph-envelope"></i>
                        <input
                          type="email"
                          id="forgot-email"
                          placeholder="name@example.com"
                          required
                          autoComplete="email"
                          value={forgotForm.email}
                          onChange={(e) => updateForgot("email", e.target.value)}
                        />
                      </div>
                    </div>
                  </div>

                  <button type="submit" className="primary-btn" disabled={loading.forgot}>
                    <i className={loading.forgot ? "ph ph-spinner-gap ph-spin" : "ph ph-paper-plane-tilt"}></i>
                    <span>{loading.forgot ? t.loading_reset : t.send_reset_link}</span>
                  </button>

                  <p className="switch-form-text">
                    <span>{t.remembered_password}</span>
                    <button type="button" onClick={() => openTab("login")}>{t.sign_in}</button>
                  </p>
                </form>
              )}
            </div>
          </section>
        </main>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("auth-app"));
    root.render(<App />);
  </script>
</body>
</html>
